<div class="container d-flex justify-content-center align-items-center">
    <div class="row">
        <div class="col text-center">
            <h1>Confirm your delivery:</h1>
        </div>
    <div class="row">
            <p class="col text-center">Delivery: <b>${{ order_price }}</b></p>
    </div>
    <div class="row">
            <p class="col text-center">Tax (8.25%): <b>${{ tax }}</b></p>
    </div>
    <div class="row">
        <p class="col text-center"><b>Total: ${{ final_price }}</b></p>

    </div>
        
    </div>


    <!-- Hidden polyline and address data -->
    <div id="polyline-data" style="display: none;">{{ polyline }}</div>
    <div id="origin-address-latitude" style="display: none;">{{ origin_address_coordinates.0 }}</div>
    <div id="origin-address-longitude" style="display: none;">{{ origin_address_coordinates.1 }}</div>
    <div id="destination-address-latitude" style="display: none;">{{ destination_address_coordinates.0 }}</div>
    <div id="destination-address-longitude" style="display: none;">{{ destination_address_coordinates.1 }}</div>
</div>
