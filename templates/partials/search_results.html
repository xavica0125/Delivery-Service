{% if search_results %}
{% for result in search_results %}

<tr data-control-number="{{ result.control_number }}">
    <td>{{result.control_number}}</td>
    <td>{{result.pickup_address}}</td>
    <td>{{result.delivery_address}}</td>
    <td>{{result.time_created}}</td>
    <td>{{result.total_amount}}</td>
</tr>
{% endfor %}
{% endif %}
