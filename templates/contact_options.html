{% block content %}

<select class="form-select" id="contact-select" name="contact"
    aria-label="Contact select">
    <option selected>Select a contact</option>
    {% for contact in contact_list %}
    <option value="{{contact.id}}">{{ contact }}</option>
    {% endfor %}
</select>
<label for="contact-select">Contact</label>
<div class="mb-3"></div>
<button value="{{ delivery_address }}" class="btn btn-primary"
    onclick="location.href = '/add_contact?delivery_address=' + this.value;">Add
    new
    contact </button>

<div id="delivery_address_placeid1" style="display: none;">{{ delivery_address_placeid1 }}</div>
<div id="pickup_address_placeid1" style="display: none;">{{ pickup_address_placeid1 }}</div>
{% endblock %}
